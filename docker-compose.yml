
services:
  postgres:
    image: postgres:15-alpine
    container_name: asterion-postgres
    environment:
      POSTGRES_USER: asterion
      POSTGRES_PASSWORD: asterion_dev
      POSTGRES_DB: asterion
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ground/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterion"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: asterion-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@asterion.local
      PGADMIN_DEFAULT_PASSWORD: asterion
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata: