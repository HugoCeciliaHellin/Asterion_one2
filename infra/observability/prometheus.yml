# Prometheus Configuration for Asterion One
# Scrapes metrics from OTel Collector's Prometheus exporter

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: 'asterion-otel'

  - job_name: 'ground-api'
    metrics_path: '/api/health'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'asterion-ground'
    scrape_interval: 10s